<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>120FPS Mobile Aim Trainer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: -apple-system, sans-serif; color: #fff; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud {
position: absolute; top: 20px; left: 20px; pointer-events: none;
background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 10px;
font-size: 14px; font-weight: 600; font-mono: monospace; backdrop-filter: blur(4px);
}
.high-fps { color: #00ff88; }
.standard-fps { color: #ffbb00; }
</style>
</head>
<body>
<div id="hud">
FPS: <span id="fps" class="standard-fps">0</span> | Hits: <span id="hits">0</span> | Acc: <span id="acc">100%</span>
</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fpsElem = document.getElementById('fps');
const hitsElem = document.getElementById('hits');
const accElem = document.getElementById('acc');

let target = { x: 0, y: 0, radius: 45 };
let hits = 0;
let totalShots = 0;
let lastTime = performance.now();
let frameCount = 0;

function resize() {
canvas.width = window.innerWidth * window.devicePixelRatio;
canvas.height = window.innerHeight * window.devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

function spawnTarget() {
const pad = 100 * window.devicePixelRatio;
target.x = pad + Math.random() * (canvas.width
pad * 2);
target.y = pad + Math.random() * (canvas.height
pad * 2);
target.radius = 40 * window.devicePixelRatio;
}
canvas.addEventListener('pointerdown', (e) => {
const rect = canvas.getBoundingClientRect();
const touchX = (e.clientX
rect.left) * window.devicePixelRatio;
const touchY = (e.clientY
rect.top) * window.devicePixelRatio;
totalShots++;
const distance = Math.hypot(touchX
target.x, touchY
target.y);

if (distance <= target.radius) {
hits++;
spawnTarget();
}

hitsElem.textContent = hits;
accElem.textContent = Math.round((hits / totalShots) * 100) + '%';
});
function gameLoop(now) {
frameCount++;
if (now
lastTime >= 1000) {
fpsElem.textContent = frameCount;
fpsElem.className = frameCount > 90 ? 'high-fps' : 'standard-fps';
frameCount = 0;
lastTime = now;
}
ctx.clearRect(0, 0, canvas.width, canvas.height);

// Render Target
ctx.beginPath();
ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
ctx.fillStyle = '#ff3366';
ctx.fill();
ctx.lineWidth = 4 * window.devicePixelRatio;
ctx.strokeStyle = '#ffffff';
ctx.stroke();

requestAnimationFrame(gameLoop);
}

spawnTarget();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
